# PostgreSQL crash-safety configuration for local lab deployment.
# These settings ensure data durability in the event of sudden power loss.

# Allow connections from any network interface (required for Docker networking).
# The web container connects via the Docker bridge network, not loopback,
# so we must bind to all interfaces. pg_hba.conf still controls who can authenticate.
listen_addresses = '*'

# Ensures every committed transaction is physically written to disk before
# PostgreSQL confirms success to the application. NEVER disable this.
fsync = on

# Forces WAL records to be written to the OS buffer on each commit.
# Provides additional safety guarantee on top of fsync.
synchronous_commit = on

# Ensures WAL data is flushed to disk before data pages are written.
# Guarantees WAL log is always ahead of the actual data.
wal_level = replica

# Keeps enough WAL history for crash recovery. 32MB is sufficient for
# a low-traffic election server. Increase if you see WAL warnings.
wal_buffers = 16MB

# Checkpoint frequency: write dirty pages to disk every 5 minutes or
# when WAL grows by 64MB, whichever comes first.
checkpoint_timeout = 5min
max_wal_size = 64MB

# Ensures a clean checkpoint is written on shutdown so recovery is faster.
checkpoint_completion_target = 0.9
